<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 44">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A8892F"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="52" height="44" rx="9" fill="#0c0b10"/>

  <!-- Cadre extérieur -->
  <rect x="2" y="2" width="48" height="40" rx="7.5" fill="none" stroke="url(#g)" stroke-width="1.2"/>

  <!-- Cadre intérieur fin -->
  <rect x="5" y="5" width="42" height="34" rx="5.5" fill="none" stroke="#A8892F" stroke-width="0.4" opacity="0.4"/>

  <!-- Losanges décoratifs aux coins -->
  <polygon points="2,22 5,19 8,22 5,25" fill="#A8892F" opacity="0.7"/>
  <polygon points="44,22 47,19 50,22 47,25" fill="#A8892F" opacity="0.7"/>

  <!-- IOS — rangée du haut -->
  <text x="26" y="19"
    font-family="Georgia,'Times New Roman',serif"
    font-size="11" font-weight="700"
    fill="#C9A84C" text-anchor="middle" letter-spacing="3">IOS</text>

  <!-- Ligne séparatrice avec losange central -->
  <line x1="9" y1="23.5" x2="22" y2="23.5" stroke="#A8892F" stroke-width="0.7" opacity="0.7"/>
  <polygon points="26,21.5 28,23.5 26,25.5 24,23.5" fill="#A8892F" opacity="0.9"/>
  <line x1="30" y1="23.5" x2="43" y2="23.5" stroke="#A8892F" stroke-width="0.7" opacity="0.7"/>

  <!-- NA — rangée du bas (plus grande) -->
  <text x="26" y="35"
    font-family="Georgia,'Times New Roman',serif"
    font-size="13" font-weight="700"
    fill="#C9A84C" text-anchor="middle" letter-spacing="5">NA</text>
</svg>
