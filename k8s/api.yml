---
# Secret JWT
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: etnair
type: Opaque
stringData:
  JWT_SECRET: "etnair_jwt_secret_2024_production"
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: etnair
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: etnair-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "postgresql://etnair_user:etnair_pass@postgres:5432/etnair_db"
            - name: PORT
              value: "3000"
            - name: MINIO_ENDPOINT
              value: "minio"
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: MINIO_BUCKET
              value: "etnair-images"
          envFrom:
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /metrics
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: etnair
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: etnair
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
